name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.25.6'

jobs:
  # ──────────────────────────────────────────────────────────
  # テスト実行
  # ──────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: catchup_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: catchup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          $(go env GOPATH)/bin/swag init -g cmd/server/main.go --output docs --parseDependency --parseInternal

      - name: Run tests
        env:
          DATABASE_URL: postgresql://catchup_test:test_password@localhost:5432/catchup_test?sslmode=disable
          JWT_SECRET: test_secret_at_least_32_characters_long
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ──────────────────────────────────────────────────────────
  # Lint（静的解析）
  # ──────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          $(go env GOPATH)/bin/swag init -g cmd/server/main.go --output docs --parseDependency --parseInternal

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  # ──────────────────────────────────────────────────────────
  # シェルスクリプトの静的解析
  # 対象は deploy/scripts/*.sh(Pi / Mac の運用スクリプト)のみ。
  # 過去に本番のエピソード欠番を起こした面(tailnet プリフライト・アラート
  # 送信)なので退行防止の下限として lint する。外部 action は増やさず、
  # 公式リリースの静的バイナリを run: 内で取得して叩く。
  # バージョン固定の理由: ランナー同梱の 0.9.0 は trap 経由の関数を SC2317
  # (行ごと)で報告し、手元の 0.11.0(関数行の SC2329)と指摘コードがズレる。
  # 他ジョブ(Go / golangci-lint / swag)と同じく固定して手元と CI を揃える。
  # -x: alert-mail.sh を source するため追跡を有効化する。
  # 個別の抑制はワークフローの -e ではなくスクリプト側の
  # `# shellcheck disable=` で行う(既存 5 箇所と同じ慣習。一括除外は将来
  # 足すスクリプトの本物の指摘まで殺すため)。抑制の根拠は各行のコメント。
  # ──────────────────────────────────────────────────────────
  shellcheck:
    name: Shell Script Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          # https://github.com/koalaman/shellcheck/releases/tag/v0.11.0 の
          # linux.x86_64.tar.xz の SHA-256(Dockerfile の golangci-lint と
          # 同じく、取得物を検証してから実行する)
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          SHELLCHECK="$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          "$SHELLCHECK" --version
          "$SHELLCHECK" -x deploy/scripts/*.sh

  # ──────────────────────────────────────────────────────────
  # ビルド検証
  # ──────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          $(go env GOPATH)/bin/swag init -g cmd/server/main.go --output docs --parseDependency --parseInternal

      - name: Build Server
        run: go build -v -o server ./cmd/server

      - name: Build Worker
        run: go build -v -o worker ./cmd/worker

      - name: Check binary size
        run: |
          ls -lh server worker
          SERVER_SIZE=$(stat -c%s server)
          WORKER_SIZE=$(stat -c%s worker)
          echo "Server binary size: $(($SERVER_SIZE / 1024 / 1024)) MB"
          echo "Worker binary size: $(($WORKER_SIZE / 1024 / 1024)) MB"

  # ──────────────────────────────────────────────────────────
  # セキュリティスキャン
  # gosec の SSA 解析は対象パッケージが型検査を通ることが前提。swag 生成物が
  # 無いと cmd/server(認証・リスナー分離・私的フィード配線)だけが
  # "package main has type errors, skipping SSA analysis" で解析対象から
  # 抜け落ち、-no-fail のため緑のまま気付けない。生成物はワークスペース経由で
  # コンテナアクションからも見えるので、事前に生成しておく。
  # ──────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          $(go env GOPATH)/bin/swag init -g cmd/server/main.go --output docs --parseDependency --parseInternal

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out results.sarif ./...'

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true  # Code scanning未有効時もCIを継続
        with:
          sarif_file: results.sarif

  # ──────────────────────────────────────────────────────────
  # 依存関係の脆弱性スキャン
  # govulncheck は ./... をビルドできないと解析そのものを行わない。swag 生成物
  # が無いと cmd/server の docs ブランクインポートで exit 1 になり、
  # continue-on-error に飲まれて「緑だがスキャンはゼロ件も走っていない」
  # 状態になる(SARIF も空で upload が JSON エラーになる)。他ジョブと同じ
  # Swagger 生成を前置してこれを防ぐ。
  # ──────────────────────────────────────────────────────────
  vulnerability-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          $(go env GOPATH)/bin/swag init -g cmd/server/main.go --output docs --parseDependency --parseInternal

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck -format text ./...
        continue-on-error: true  # 脆弱性検出時も終了コード3で失敗しないように

      - name: Run govulncheck (SARIF output)
        run: govulncheck -format sarif ./... > govulncheck-results.sarif
        continue-on-error: true

      - name: Upload govulncheck SARIF
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: govulncheck-results.sarif
          category: govulncheck
