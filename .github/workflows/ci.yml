name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# GITHUB_TOKEN は default-deny。ここで全ジョブの既定を contents: read
# (actions/checkout に必要な最小)まで絞り、追加の権限が要るジョブだけが
# ジョブ単位で上書きする。目的はリポジトリ既定の継承をやめること —
# 新しいジョブを足しても「何も書かなければ read だけ」が効く。
# 注意: ジョブ単位の permissions はワークフロー既定を*マージせず置き換える*。
# 上書きするジョブ(security / vulnerability-scan)は checkout 用の
# contents: read も自分で書き直す必要がある。
permissions:
  contents: read

env:
  GO_VERSION: '1.25.6'

# Swagger 生成について(下の5ジョブが同じ "Generate Swagger docs" を持つ)
# 生成物 docs/docs.go は cmd/server がブランクインポートし、Dockerfile の
# build ステージでも同じ手順で生成されて本番バイナリに入る(C-19: Swagger
# 生成が API 契約の正)。そのため swag のバージョンは go.mod の tool
# ディレクティブ(github.com/swaggo/swag v1.16.6)一箇所で固定し、各ジョブは
# `go tool swag` で呼ぶ。ここに `go install ...@vX.Y.Z` のリテラルを書くと
# Dockerfile / Makefile と多重管理になり、CI と本番で別バージョンの生成器が
# 走り得る(2026-08-16 まで Dockerfile 側が @latest だった)。
# バージョンを上げるときは `go get github.com/swaggo/swag@vX.Y.Z` の1回で
# 全経路(CI / Docker / make swagger / make swagger-host)に反映される。

jobs:
  # ──────────────────────────────────────────────────────────
  # テスト実行
  # ──────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: catchup_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: catchup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      # swag のバージョンは go.mod の tool ディレクティブが唯一の正(冒頭コメント)
      - name: Generate Swagger docs
        run: go tool swag init -g cmd/server/main.go --output docs --parseDependency --parseInternal

      - name: Run tests
        env:
          DATABASE_URL: postgresql://catchup_test:test_password@localhost:5432/catchup_test?sslmode=disable
          JWT_SECRET: test_secret_at_least_32_characters_long
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ──────────────────────────────────────────────────────────
  # Lint（静的解析）
  # ──────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # swag のバージョンは go.mod の tool ディレクティブが唯一の正(冒頭コメント)
      - name: Generate Swagger docs
        run: go tool swag init -g cmd/server/main.go --output docs --parseDependency --parseInternal

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  # ──────────────────────────────────────────────────────────
  # シェルスクリプトの静的解析
  # 対象は deploy/scripts/*.sh(Pi / Mac の運用スクリプト)のみ。
  # 過去に本番のエピソード欠番を起こした面(tailnet プリフライト・アラート
  # 送信)なので退行防止の下限として lint する。外部 action は増やさず、
  # 公式リリースの静的バイナリを run: 内で取得して叩く。
  # バージョン固定の理由: ランナー同梱の 0.9.0 は trap 経由の関数を SC2317
  # (行ごと)で報告し、手元の 0.11.0(関数行の SC2329)と指摘コードがズレる。
  # 他ジョブ(Go / golangci-lint / swag)と同じく固定して手元と CI を揃える。
  # -x: alert-mail.sh を source するため追跡を有効化する。
  # 個別の抑制はワークフローの -e ではなくスクリプト側の
  # `# shellcheck disable=` で行う(既存 5 箇所と同じ慣習。一括除外は将来
  # 足すスクリプトの本物の指摘まで殺すため)。抑制の根拠は各行のコメント。
  # ──────────────────────────────────────────────────────────
  shellcheck:
    name: Shell Script Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          # https://github.com/koalaman/shellcheck/releases/tag/v0.11.0 の
          # linux.x86_64.tar.xz の SHA-256(Dockerfile の golangci-lint と
          # 同じく、取得物を検証してから実行する)
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          SHELLCHECK="$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          "$SHELLCHECK" --version
          "$SHELLCHECK" -x deploy/scripts/*.sh

  # ──────────────────────────────────────────────────────────
  # ビルド検証
  # ──────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # swag のバージョンは go.mod の tool ディレクティブが唯一の正(冒頭コメント)
      - name: Generate Swagger docs
        run: go tool swag init -g cmd/server/main.go --output docs --parseDependency --parseInternal

      - name: Build Server
        run: go build -v -o server ./cmd/server

      - name: Build Worker
        run: go build -v -o worker ./cmd/worker

      - name: Check binary size
        run: |
          ls -lh server worker
          SERVER_SIZE=$(stat -c%s server)
          WORKER_SIZE=$(stat -c%s worker)
          echo "Server binary size: $(($SERVER_SIZE / 1024 / 1024)) MB"
          echo "Worker binary size: $(($WORKER_SIZE / 1024 / 1024)) MB"

  # ──────────────────────────────────────────────────────────
  # セキュリティスキャン
  # gosec の SSA 解析は対象パッケージが型検査を通ることが前提。swag 生成物が
  # 無いと cmd/server(認証・リスナー分離・私的フィード配線)だけが
  # "package main has type errors, skipping SSA analysis" で解析対象から
  # 抜け落ち、-no-fail のため緑のまま気付けない。生成物はワークスペース経由で
  # コンテナアクションからも見えるので、事前に生成しておく。
  # 再発防止: gosec はコンテナアクションで stdout を後段のステップから
  # 検査できないため、「SSA 解析がスキップされる条件」そのものを前段で潰す
  # (全パッケージが型検査を通ることを確認して落とす)。
  # ──────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    # SARIF を code scanning へ上げるので security-events: write が要る
    # (github/codeql-action/upload-sarif の要求権限)。public リポジトリでは
    # これだけが必須で、docs が挙げる actions: read / contents: read は
    # private リポジトリのときの追加要件なので actions: read は持たせない。
    # contents: read は checkout 用 — ジョブ単位の permissions はワークフロー
    # 既定を置き換えるため、ここに書き直さないと checkout が権限を失う。
    # 非公開化するならこの2ジョブに actions: read を足すこと。
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # swag のバージョンは go.mod の tool ディレクティブが唯一の正(冒頭コメント)
      - name: Generate Swagger docs
        run: go tool swag init -g cmd/server/main.go --output docs --parseDependency --parseInternal

      # 型検査を通らないパッケージがあると gosec は -no-fail のまま黙って
      # SSA 解析を飛ばす。ここで落としておけば「解析されなかったのに緑」に
      # ならない(2026-08-15: swag 未生成で cmd/server が抜けていた)。
      - name: Verify packages type-check (gosec の SSA 解析の前提)
        run: go build ./...

      # CI で実行する外部ツールは一律でバージョンを固定する(shellcheck
      # v0.11.0 / golangci-lint v2.12.2 はここのリテラルで、swag は go.mod の
      # tool ディレクティブで固定する — いずれも1箇所)。@master は
      # レビューを経ずに上流の変更でスキャナ本体が入れ替わりうるため使わない。
      # 更新方法: https://github.com/securego/gosec/releases の新しいタグへ
      # 上げ、このジョブが緑になることを確認する意図的な変更として単独で行う
      # (タグ側の action.yml がコンテナイメージを digest で固定しているので、
      # 同じタグなら常に同じスキャナバイナリが走る)。
      - name: Run Gosec Security Scanner
        uses: securego/gosec@v2.28.0
        with:
          args: '-no-fail -fmt sarif -out results.sarif ./...'

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true  # Code scanning未有効時もCIを継続
        with:
          sarif_file: results.sarif

  # ──────────────────────────────────────────────────────────
  # 依存関係の脆弱性スキャン
  # govulncheck は ./... をロードできないと解析そのものを行わない。swag 生成物
  # が無いと cmd/server の docs ブランクインポートで exit 1 になり、
  # continue-on-error に飲まれて「緑だがスキャンはゼロ件も走っていない」
  # 状態になる(SARIF も空で upload が JSON エラーになる)。他ジョブと同じ
  # Swagger 生成を前置し、さらに終了コードで両者を区別する:
  #   0 = 脆弱性なし / 3 = 脆弱性あり → 緑のまま(検出で個人開発の CI を
  #   止めない)。それ以外(1 = ロード失敗など)= スキャンが成立していない
  #   → 落とす。continue-on-error 任せだとこの区別ができず、実際に
  #   2026-08-15 まで「動いていないのに緑」を見逃した。
  # ──────────────────────────────────────────────────────────
  vulnerability-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    # security ジョブと同じ理由(SARIF アップロード)で上書きする。
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # swag のバージョンは go.mod の tool ディレクティブが唯一の正(冒頭コメント)
      - name: Generate Swagger docs
        run: go tool swag init -g cmd/server/main.go --output docs --parseDependency --parseInternal

      # gosec と同じく固定する(CI で実行する外部ツールは一律固定)。脆弱性 DB は
      # バイナリに同梱されず実行時に https://vuln.go.dev から取得する
      # (`govulncheck -version` が DB URL と DB 更新日を出す)ため、ツールを
      # 固定しても検出される脆弱性は常に最新で、@latest にする理由はない。
      # 更新方法: https://github.com/golang/vuln/releases の新しいタグへ上げ、
      # 解析側(呼び出しグラフ精度など)の改善を意図的な変更として取り込む。
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      # `cmd; c=$?` は使えない: run: の既定シェルは `bash -e` なので、
      # 非ゼロ終了の時点で $? を拾う前にステップが落ちる。`|| c=$?` で受ける。
      - name: Run govulncheck
        run: |
          c=0
          govulncheck -format text ./... || c=$?
          [ "$c" -eq 0 ] || [ "$c" -eq 3 ] || exit 1

      - name: Run govulncheck (SARIF output)
        run: |
          c=0
          govulncheck -format sarif ./... > govulncheck-results.sarif || c=$?
          [ "$c" -eq 0 ] || [ "$c" -eq 3 ] || exit 1

      - name: Upload govulncheck SARIF
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: govulncheck-results.sarif
          category: govulncheck
