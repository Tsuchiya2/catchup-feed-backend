name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.25.6'

jobs:
  # ──────────────────────────────────────────────────────────
  # テスト実行
  # ──────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: catchup_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: catchup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          $(go env GOPATH)/bin/swag init -g cmd/server/main.go --output docs --parseDependency --parseInternal

      - name: Run tests
        env:
          DATABASE_URL: postgresql://catchup_test:test_password@localhost:5432/catchup_test?sslmode=disable
          JWT_SECRET: test_secret_at_least_32_characters_long
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ──────────────────────────────────────────────────────────
  # Lint（静的解析）
  # ──────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          $(go env GOPATH)/bin/swag init -g cmd/server/main.go --output docs --parseDependency --parseInternal

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  # ──────────────────────────────────────────────────────────
  # シェルスクリプトの静的解析
  # 対象は deploy/scripts/*.sh(Pi / Mac の運用スクリプト)のみ。
  # 過去に本番のエピソード欠番を起こした面(tailnet プリフライト・アラート
  # 送信)なので退行防止の下限として lint する。外部 action は増やさず、
  # 公式リリースの静的バイナリを run: 内で取得して叩く。
  # バージョン固定の理由: ランナー同梱の 0.9.0 は trap 経由の関数を SC2317
  # (行ごと)で報告し、手元の 0.11.0(関数行の SC2329)と指摘コードがズレる。
  # 他ジョブ(Go / golangci-lint / swag)と同じく固定して手元と CI を揃える。
  # -x: alert-mail.sh を source するため追跡を有効化する。
  # 除外(スクリプト側の disable コメントではなく、理由を1箇所に集約するため
  # ここで指定する):
  #   SC2329 … `trap cleanup EXIT` で呼ばれる関数を「未使用」と誤判定する。
  #   SC2012 … ログ用のファイル数カウント `ls | wc -l` に find を薦める指摘。
  #             出力はログ文言のみで、対象は本システムが生成する mp3 / PDF に
  #             限られるため実害がない。
  # ──────────────────────────────────────────────────────────
  shellcheck:
    name: Shell Script Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          SHELLCHECK="$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          "$SHELLCHECK" --version
          "$SHELLCHECK" -x -e SC2329,SC2012 deploy/scripts/*.sh

  # ──────────────────────────────────────────────────────────
  # ビルド検証
  # ──────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          $(go env GOPATH)/bin/swag init -g cmd/server/main.go --output docs --parseDependency --parseInternal

      - name: Build Server
        run: go build -v -o server ./cmd/server

      - name: Build Worker
        run: go build -v -o worker ./cmd/worker

      - name: Check binary size
        run: |
          ls -lh server worker
          SERVER_SIZE=$(stat -c%s server)
          WORKER_SIZE=$(stat -c%s worker)
          echo "Server binary size: $(($SERVER_SIZE / 1024 / 1024)) MB"
          echo "Worker binary size: $(($WORKER_SIZE / 1024 / 1024)) MB"

  # ──────────────────────────────────────────────────────────
  # セキュリティスキャン
  # ──────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out results.sarif ./...'

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true  # Code scanning未有効時もCIを継続
        with:
          sarif_file: results.sarif

  # ──────────────────────────────────────────────────────────
  # 依存関係の脆弱性スキャン
  # ──────────────────────────────────────────────────────────
  vulnerability-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck -format text ./...
        continue-on-error: true  # 脆弱性検出時も終了コード3で失敗しないように

      - name: Run govulncheck (SARIF output)
        run: govulncheck -format sarif ./... > govulncheck-results.sarif
        continue-on-error: true

      - name: Upload govulncheck SARIF
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: govulncheck-results.sarif
          category: govulncheck
