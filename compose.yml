# ============================================================
# catchup-feed(後継 pulse)— ベース compose(server + worker + PostgreSQL)
# ============================================================
# 単独では開発 Mac 用スタックとして動く。本番(Raspberry Pi 5)は
# deploy/compose.pi.yml を override として重ねる:
#   docker compose -f compose.yml -f deploy/compose.pi.yml --env-file deploy/.env up -d
# Pi 固有差分(TAILNET_IP バインド、EPISODES_DIR/BOOKS_DIR の必須化)は
# すべて override 側にあり、このファイルが両環境共通の正。
#
# 開発 Mac 単独時の挙動(= Pi との意図的な差分):
#   - TAILNET_IP を要求しない。ポート公開は 127.0.0.1 バインドのみ
#     (API_PORT 既定 8090 / POSTGRES_PORT 既定 5433 — Pi と同じ既定値)。
#     私的リスナー(8081)はコンテナ内で listen するがホストへは公開しない
#   - EPISODES_DIR / BOOKS_DIR の既定はリポジトリ内 ./data/*(gitignore 済み)
#   - lint / テスト用の dev サービス(profiles: dev、Makefile が参照)を持つ
#     (Pi では profiles 不活性のため起動しない)
#
# 使い方(開発 Mac):
#   cp .env.example .env   # 値を記入(POSTGRES_PASSWORD / JWT_SECRET / ADMIN_PASSWORD_HASH は必須)
#   docker compose up -d --build
#
# server の healthcheck は Dockerfile の HEALTHCHECK(curl -f http://localhost:8080/health)
# に依存する。worker の depends_on はこれを条件にしている。

name: catchup-feed

volumes:
  db-data:
    driver: local
  # dev サービス用キャッシュ
  go-mod-cache:
    driver: local
  go-build-cache:
    driver: local

services:
  postgres:
    # pgvector 0.8.5 on PostgreSQL 18(旧 compose から継承したピン)。
    # PG メジャーは 18 に固定 — db-data ボリューム(/var/lib/postgresql)は
    # メジャーを跨ぐと移行が必要になる。メジャーを上げるときは必ず
    # ボリューム移行手順(pg_dump/restore 等)の文書化とセットで行うこと。
    image: pgvector/pgvector:0.8.5-pg18
    container_name: catchup-feed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-catchup-feed}
      POSTGRES_DB: ${POSTGRES_DB:-catchup-feed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      # PostgreSQL 18 は /var/lib/postgresql をマウントする(旧 compose の知見を継承)
      - db-data:/var/lib/postgresql
    ports:
      # 開発 Mac ではローカルのみ(tailnet バインドは Pi 専用)
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catchup-feed-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-catchup-feed}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-catchup-feed}?sslmode=disable

      # 認証(C-7 / C-20)
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_USER: ${ADMIN_USER:-admin}
      # make admin-hash で生成。.env 内ではハッシュ中の '$' を '$$' にエスケープ
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH in .env}

      # フィード配信(§5 / D-6)
      FEED_PUBLIC_BASE_URL: ${FEED_PUBLIC_BASE_URL:-https://radio.catchup-feed.com}
      FEED_AUDIO_DIR: /data/episodes
      FEED_CHANNEL_TITLE: ${FEED_CHANNEL_TITLE:-}
      FEED_CHANNEL_DESCRIPTION: ${FEED_CHANNEL_DESCRIPTION:-}
      FEED_MAX_ITEMS: ${FEED_MAX_ITEMS:-}

      # 私的フィード(C-5)。コンテナ内でのみ listen し、開発 Mac では
      # ホストへ公開しない(Pi では ${TAILNET_IP}:8081 に限定公開)
      PRIVATE_FEED_ADDR: ${PRIVATE_FEED_ADDR:-server:8081}
      FEED_PRIVATE_BASE_URL: ${FEED_PRIVATE_BASE_URL:-}

      # 書籍 PDF 管理(D-25)。コンテナ内パスが books.file_path に記録される
      BOOKS_DIR: /data/books

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env}

      # 認証 cookie の Domain(D-22)。開発では空のまま(localhost)でよい
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}

      # Cloudflare Tunnel 越しのみ有効化(開発 Mac では未設定のまま)
      RATE_LIMIT_TRUST_PROXY: ${RATE_LIMIT_TRUST_PROXY:-}
      RATE_LIMIT_TRUSTED_PROXIES: ${RATE_LIMIT_TRUSTED_PROXIES:-}

      TZ: ${TZ:-Asia/Tokyo}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${API_PORT:-8090}:8080"
    volumes:
      # mp3 アーカイブ。server は配信のみ(読み取り専用)
      - ${EPISODES_DIR:-./data/episodes}:/data/episodes:ro
      # 書籍 PDF(D-25)。server がアップロード保存・削除を行うため読み書き
      - ${BOOKS_DIR:-./data/books}:/data/books
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catchup-feed-worker
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/worker"]
    command: []
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_healthy # マイグレーションは server 起動時に適用される
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-catchup-feed}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-catchup-feed}?sslmode=disable

      # 要約フォールバック連鎖(Gemini → Groq → Ollama)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      SUMMARIZER_CHAR_LIMIT: ${SUMMARIZER_CHAR_LIMIT:-}
      SUMMARIZER_TIMEOUT: ${SUMMARIZER_TIMEOUT:-}

      # 通知(D-29: 本人向けもメールに一本化。Discord/Slack は廃止)
      # SMTP_* は本人向け(D-29)のみ。友人向けメールは D-32 で廃止
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NOTIFY_ERROR_EMAIL_TO: ${NOTIFY_ERROR_EMAIL_TO:-}

      # jobs コンシューマ + D-4 cleanup(mp3 45日保持)
      JOBS_POLL_INTERVAL: ${JOBS_POLL_INTERVAL:-}
      CLEANUP_CRON_SCHEDULE: ${CLEANUP_CRON_SCHEDULE:-}
      FEED_AUDIO_DIR: /data/episodes
      FEED_PRIVATE_BASE_URL: ${FEED_PRIVATE_BASE_URL:-}

      # クロール(§3.3: 毎時)
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 * * * *}
      WORKER_TIMEZONE: ${WORKER_TIMEZONE:-Asia/Tokyo}
      CRAWL_TIMEOUT: ${CRAWL_TIMEOUT:-30m}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-9091}
      # newsletter ソースの号あたり展開記事数上限(既定 10)
      NEWSLETTER_MAX_ARTICLES: ${NEWSLETTER_MAX_ARTICLES:-}

      TZ: ${TZ:-Asia/Tokyo}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9091/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      # cleanup_old_media(D-4)が古い mp3 を削除するため読み書き
      - ${EPISODES_DIR:-./data/episodes}:/data/episodes
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ──────────────────────────────────────────────────────────
  # 開発環境(lint・テスト用。Makefile の test / lint / admin-hash 等が参照)
  # ──────────────────────────────────────────────────────────
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: catchup-feed-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-catchup-feed}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-catchup-feed}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-}
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      # ソースコードをマウント(ホットリロード対応)
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    # デフォルトでは起動しない(明示的に --profile dev が必要)
    profiles:
      - dev
    stdin_open: true
    tty: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
