# ============================================================
# catchup-feed(後継 pulse)— Raspberry Pi 5 本番 override
# ============================================================
# このファイルは単体では起動できない。ルート compose.yml をベースに、
# Pi 固有の差分だけを重ねる override として使う(リポジトリルートから実行):
#
#   docker compose -f compose.yml -f deploy/compose.pi.yml --env-file deploy/.env up -d --build
#
# --env-file deploy/.env は省略不可: 複数 -f 指定時の project directory は
# 最初の -f のディレクトリ(= リポジトリルート)になるため、deploy/.env は
# 自動では読まれない(ルートに .env があればそちらが読まれてしまう)。
# systemd unit(deploy/systemd/pulse.service)・pi.md のコマンド例もすべて
# この形に揃えてある。詳細な手順は deploy/pi.md。
#
# ここに置くのは「Pi と開発 Mac で意図的に違えている差分」だけ:
#   - postgres / server のポートを ${TAILNET_IP} にも追加バインド
#     (compose のマージで ports は追記される。ベースの 127.0.0.1 バインドは残る)
#   - EPISODES_DIR / BOOKS_DIR を :? で必須化し、ホスト側絶対パスを要求
#     (同じコンテナ内ターゲットへのマウントは override が勝つ)
# サービス構成・環境変数・healthcheck はベース compose.yml が正。
# Pi 固有の運用値(ポート番号・パス・秘密値)は deploy/.env が持つ。
#
# 命名についての注意(混同厳禁):
#   このスタックのコンテナ名は catchup-feed-*(catchup-feed-postgres / -server / -worker)。
#   かつて同一ホストに同居していた【初代】システムのコンテナは catchup-*(ハイフンの
#   後が違うだけの別物)で、2026-07-06 に停止・2026-08-15 に撤去済み(deploy/legacy-shutdown.md)。
#   初代の実体はもう無いが、compose プロジェクト名・ディレクトリ名・systemd unit 名まで
#   catchup-feed 系で重なるため、停止・削除系のコマンドは打つ前に実体を確認する
#   (legacy-shutdown.md 8章「地雷」)。今この Pi にある catchup* はすべて pulse の現用資産。
#
# ポート公開の設計(公開面の最小化):
#   - 公開リスナー(:8080)→ 127.0.0.1:${API_PORT} のみ。外へは Cloudflare Tunnel 経由
#   - 私的リスナー(:8081)→ ${TAILNET_IP}:8081 のみ。tailnet 外・LAN には出ない(C-5)
#   - PostgreSQL(:5432) → 127.0.0.1 と ${TAILNET_IP} の 5433。radio(Mac)が tailnet 越しに接続
#   ホスト側ポート 8090 / 8081 / 5433 は初代(8080 / 9091 / 5432)と衝突しない値として選んだ
#   (共存期の名残。初代停止後も値は変えていない)。
#
# TAILNET_IP へのバインドは tailscaled が IP を持った後でないと失敗する。
# ブート時の起動順は deploy/systemd/pulse.service が保証する(pi.md 4章。
# unit 名は pulse.service のまま維持)。

name: catchup-feed

services:
  postgres:
    ports:
      # Pi ローカル(psql・デバッグ)はベースの 127.0.0.1 バインド。
      # ここでは tailnet(radio バッチ・バックアップ)向けを追加する。LAN には公開しない。
      - "${TAILNET_IP:?set TAILNET_IP in deploy/.env (tailscale ip -4)}:${POSTGRES_PORT:-5433}:5432"

  server:
    ports:
      # 私的リスナー(C-5)。tailnet にのみ限定公開
      - "${TAILNET_IP}:8081:8081"
    volumes:
      # Pi ではホスト側絶対パスを必須にする(ベースの ./data/* 既定を上書き)
      - ${EPISODES_DIR:?set EPISODES_DIR in deploy/.env}:/data/episodes:ro
      - ${BOOKS_DIR:?set BOOKS_DIR in deploy/.env}:/data/books

  worker:
    volumes:
      - ${EPISODES_DIR:?set EPISODES_DIR in deploy/.env}:/data/episodes
